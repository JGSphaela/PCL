name: Build Locale-Unrestricted PCL

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit to build
        required: false
        default: main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: locale-unrestricted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout latest upstream PCL
        uses: actions/checkout@v6
        with:
          repository: Meloong-Git/PCL
          ref: ${{ github.event.inputs.upstream_ref || 'main' }}
          fetch-depth: 0
          submodules: true

      - name: Set upstream metadata
        shell: pwsh
        run: |
          $describe = git describe --tags --always
          "describe=$describe" >> $env:GITHUB_ENV
          "upstream_sha=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Remove locale guard
        shell: pwsh
        run: |
          $path = "Plain Craft Launcher 2\Modules\Minecraft\ModLaunch.vb"
          $text = [IO.File]::ReadAllText($path)

          $patterns = @(
            'If IsSystemLanguageChinese\(\) Then',
            'If\s+Globalization\.CultureInfo\.CurrentCulture\.Name\.StartsWithF?\("zh"\)\s+OrElse\s+Globalization\.CultureInfo\.CurrentUICulture\.Name\.StartsWithF?\("zh"\)\s+Then(?:\s+''中文？)?'
          )

          $changed = $false
          foreach ($pattern in $patterns) {
            $matches = [regex]::Matches($text, $pattern)
            if ($matches.Count -gt 1) {
              throw "Locale guard matched more than once. Refusing an ambiguous patch."
            }
            if ($matches.Count -eq 1) {
              $text = [regex]::Replace(
                $text,
                $pattern,
                "If True Then ' Locale-independent custom build",
                1
              )
              $changed = $true
              break
            }
          }

          if (-not $changed) {
            throw "Known locale guard not found in $path. Upstream likely changed; update this workflow before building."
          }

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- "$path"

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update Help
        shell: pwsh
        run: |
          Set-Location ..
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
          Set-Location PCL2Help
          Remove-Item -Path *.* -Recurse -Force
          Compress-Archive -Path .\* -DestinationPath .\Help.zip
          Copy-Item -Path .\Help.zip -Destination "${{ github.workspace }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
          Set-Location ..
          Remove-Item PCL2Help -Recurse -Force
          Set-Location "${{ github.workspace }}"

      - name: Inject optional API secrets
        shell: pwsh
        run: |
          (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If\(Environment.GetEnvironmentVariable\("PCL_MS_CLIENT_ID"\), ""\)', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
          (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If\(Environment.GetEnvironmentVariable\("PCL_CURSEFORGE_API_KEY"\), ""\)', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
          (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ env.upstream_sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

      - name: Restore NuGet packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build Release
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

      - name: Upload Release artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-locale-unrestricted-${{ env.describe }}
          path: Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe
          if-no-files-found: error
